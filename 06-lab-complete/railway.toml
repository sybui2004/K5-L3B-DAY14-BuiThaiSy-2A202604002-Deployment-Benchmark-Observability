# Secret (AGENT_API_KEY, REDIS_URL) đặt bằng biến môi trường trên Railway, không ghi ở đây.
# Không đặt startCommand: dùng CMD trong Dockerfile, CMD đã đọc biến PORT.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
